global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'production'
    monitor: 'app-monitoring'

alerting:
  alertmanagers:
    - scheme: http
      static_configs:
        - targets: ['alertmanager:9093']  # Важно: используем имя сервиса Docker
      timeout: 10s
      api_version: v2  # Используем API v2

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: "app"
    static_configs:
      - targets: ["app:8000"]

rule_files:
  - '/etc/prometheus/alert_rules.yml'